<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>SR Sandbox - physics self-tests</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    body { padding: 16px 24px; max-width: 1100px; }
    td, th { padding: 4px 8px; border-bottom: 1px solid #e3e7ec; text-align: left; vertical-align: top; }
    .ok { color: #1a7f37; font-weight: 700; } .fail { color: #cf222e; font-weight: 700; }
    table { border-collapse: collapse; width: 100%; background: #fff; }
    code { font-size: 12px; }
  </style>
</head>
<body>
  <h2>Physics core self-tests</h2>
  <p>Each line checks a formula of the sandbox against an independent computation (matrix algebra,
     conservation laws, closed-form results from the script). Section numbers refer to Dragan,
     <i>Unusually Special Relativity</i>.</p>
  <p id="summary"></p>
  <table id="t"><tr><th></th><th>check</th><th>ref.</th><th>details</th></tr></table>
  <script src="js/core/physics.js"></script>
  <script src="js/core/tests.js"></script>
  <script>
    const res = SR.runTests(), t = document.getElementById('t');
    let ok = 0;
    for (const r of res) {
      if (r.ok) ok++;
      const tr = document.createElement('tr');
      tr.innerHTML = `<td class="${r.ok ? 'ok' : 'fail'}">${r.ok ? 'PASS' : 'FAIL'}</td><td>${r.name}</td><td>${r.ref}</td><td><code>${r.detail}</code></td>`;
      t.append(tr);
    }
    document.getElementById('summary').innerHTML = `<b class="${ok === res.length ? 'ok' : 'fail'}">${ok} / ${res.length} passed</b>`;
  </script>
</body>
</html>
